<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Four speech recognition decoder choices</title>
  <desc id="desc">CTC emits frame labels and blanks in parallel; RNN-T uses prediction history and a joint network; TDT predicts tokens and durations; an autoregressive Transformer emits tokens step by step.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.arrowhead{fill:#334155}.blue{fill:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.red{fill:#b43d00}.purple{fill:#563080}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}.arrowhead{fill:#cbd5e1}}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="500" rx="24"/>
  <text class="text" x="48" y="53" font-size="32" font-weight="700">Four ways to turn frames into text</text>
  <text class="muted" x="48" y="86" font-size="20">The head or objective is separate from the FastConformer encoder.</text>
  <g transform="translate(44 125)">
    <g><rect width="210" height="190" rx="14" fill="#0072b2" opacity=".16" stroke="#005a8d" stroke-width="4"/><text class="text" x="105" y="36" text-anchor="middle" font-size="22" font-weight="700">CTC</text><text class="muted" x="105" y="65" text-anchor="middle" font-size="17">parallel frame labels</text><g fill="#005a8d"><rect x="26" y="88" width="32" height="32" rx="5"/><rect x="64" y="88" width="32" height="32" rx="5"/><rect x="102" y="88" width="32" height="32" rx="5"/><rect x="140" y="88" width="32" height="32" rx="5"/></g><text fill="white" x="42" y="111" text-anchor="middle" font-size="15">T</text><text fill="white" x="80" y="111" text-anchor="middle" font-size="15">_</text><text fill="white" x="118" y="111" text-anchor="middle" font-size="15">h</text><text fill="white" x="156" y="111" text-anchor="middle" font-size="15">e</text><text class="muted" x="105" y="158" text-anchor="middle" font-size="17">blank + collapse</text></g>
    <g transform="translate(232 0)"><rect width="210" height="190" rx="14" fill="#e69f00" opacity=".2" stroke="#a85d00" stroke-width="4"/><text class="text" x="105" y="36" text-anchor="middle" font-size="22" font-weight="700">RNN-T</text><text class="muted" x="105" y="65" text-anchor="middle" font-size="17">history + joint</text><circle cx="56" cy="111" r="25" fill="#a85d00"/><circle cx="154" cy="111" r="25" fill="#b43d00"/><path d="M81 111h48" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/><text fill="white" x="56" y="116" text-anchor="middle" font-size="14">audio</text><text fill="white" x="154" y="116" text-anchor="middle" font-size="14">joint</text><text class="muted" x="105" y="158" text-anchor="middle" font-size="17">prediction history</text></g>
    <g transform="translate(464 0)"><rect width="210" height="190" rx="14" fill="#009e73" opacity=".18" stroke="#007a59" stroke-width="4"/><text class="text" x="105" y="36" text-anchor="middle" font-size="22" font-weight="700">TDT</text><text class="muted" x="105" y="65" text-anchor="middle" font-size="17">token + duration</text><rect x="20" y="86" width="78" height="42" rx="6" fill="#007a59"/><rect x="112" y="86" width="78" height="42" rx="6" fill="#007a59"/><text fill="white" x="59" y="102" text-anchor="middle" font-size="12">token</text><text fill="white" x="59" y="120" text-anchor="middle" font-size="14" font-weight="700">word</text><text fill="white" x="151" y="102" text-anchor="middle" font-size="12">duration</text><text fill="white" x="151" y="120" text-anchor="middle" font-size="14" font-weight="700">3 frames</text><path d="M50 151h110" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/><text class="muted" x="105" y="178" text-anchor="middle" font-size="16">advance 3 frames</text></g>
    <g transform="translate(696 0)"><rect width="210" height="190" rx="14" fill="#6a3d9a" opacity=".18" stroke="#563080" stroke-width="4"/><text class="text" x="105" y="36" text-anchor="middle" font-size="20" font-weight="700">Transformer</text><text class="muted" x="105" y="65" text-anchor="middle" font-size="17">autoregressive</text><g fill="#563080"><rect x="28" y="88" width="32" height="34" rx="6"/><rect x="68" y="88" width="32" height="34" rx="6"/><rect x="108" y="88" width="32" height="34" rx="6"/><rect x="148" y="88" width="32" height="34" rx="6"/></g><text fill="white" x="44" y="111" text-anchor="middle" font-size="14">T</text><text fill="white" x="84" y="111" text-anchor="middle" font-size="14">h</text><text fill="white" x="124" y="111" text-anchor="middle" font-size="14">e</text><text fill="white" x="164" y="111" text-anchor="middle" font-size="14">...</text><path d="M28 143h152" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/><text class="muted" x="105" y="172" text-anchor="middle" font-size="16">one token at a time</text></g>
  </g>
  <text class="muted" x="500" y="370" text-anchor="middle" font-size="20">Same encoder output, different alignment and decoding contracts.</text>
  <text class="muted" x="500" y="408" text-anchor="middle" font-size="19">TDT's duration prediction belongs to its head and runtime.</text>
</svg>
