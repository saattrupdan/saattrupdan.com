<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Four speech recognition decoder choices</title>
  <desc id="desc">CTC emits frame labels and blanks in parallel; RNN-T uses prediction history and a joint network; TDT predicts tokens and durations; an autoregressive Transformer emits tokens step by step.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#475569;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{fill:#0072b2}.orange{fill:#e69f00}.green{fill:#009e73}.red{fill:#d55e00}.purple{fill:#6a3d9a}.sky{fill:#56b4e9}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#cbd5e1}.line{stroke:#cbd5e1}}
  </style>
  <rect class="bg" width="1000" height="610" rx="24"/>
  <text class="text" x="48" y="53" font-size="27" font-weight="700">Four ways to turn frames into text</text>
  <text class="muted" x="48" y="82" font-size="16">The decoder or objective is separate from the FastConformer encoder.</text>
  <g transform="translate(44 120)">
    <g><rect width="210" height="190" rx="14" class="blue" opacity=".16" stroke="#0072b2" stroke-width="3"/><text class="text" x="105" y="34" text-anchor="middle" font-size="20" font-weight="700">CTC</text><text class="muted" x="105" y="62" text-anchor="middle" font-size="15">parallel frame labels</text><g fill="#0072b2"><rect x="26" y="86" width="32" height="30" rx="5"/><rect x="64" y="86" width="32" height="30" rx="5"/><rect x="102" y="86" width="32" height="30" rx="5"/><rect x="140" y="86" width="32" height="30" rx="5"/></g><text class="text" x="42" y="107" text-anchor="middle" font-size="13" fill="white">T</text><text class="text" x="80" y="107" text-anchor="middle" font-size="13" fill="white">_</text><text class="text" x="118" y="107" text-anchor="middle" font-size="13" fill="white">h</text><text class="text" x="156" y="107" text-anchor="middle" font-size="13" fill="white">e</text><text class="muted" x="105" y="151" text-anchor="middle" font-size="15">blank + collapse</text></g>
    <g transform="translate(232 0)"><rect width="210" height="190" rx="14" class="orange" opacity=".2" stroke="#e69f00" stroke-width="3"/><text class="text" x="105" y="34" text-anchor="middle" font-size="20" font-weight="700">RNN-T</text><text class="muted" x="105" y="62" text-anchor="middle" font-size="15">history + joint</text><circle cx="56" cy="109" r="24" fill="#e69f00"/><circle cx="154" cy="109" r="24" fill="#d55e00"/><path d="M82 109h45" class="line" stroke-width="3"/><path d="m118 101 10 8-10 8" fill="none" class="line" stroke-width="3"/><text class="text" x="56" y="114" text-anchor="middle" font-size="13">audio</text><text fill="white" x="154" y="114" text-anchor="middle" font-size="13">joint</text><text class="muted" x="105" y="151" text-anchor="middle" font-size="15">prediction history</text></g>
    <g transform="translate(464 0)"><rect width="210" height="190" rx="14" class="green" opacity=".18" stroke="#009e73" stroke-width="3"/><text class="text" x="105" y="34" text-anchor="middle" font-size="20" font-weight="700">TDT</text><text class="muted" x="105" y="62" text-anchor="middle" font-size="15">token + duration</text><rect x="30" y="91" width="54" height="32" rx="6" fill="#009e73"/><rect x="96" y="91" width="54" height="32" rx="6" fill="#009e73"/><path d="M158 107h28" stroke="#009e73" stroke-width="7"/><path d="m178 97 12 10-12 10" fill="none" stroke="#009e73" stroke-width="3"/><text fill="white" x="57" y="112" text-anchor="middle" font-size="13">word</text><text fill="white" x="123" y="112" text-anchor="middle" font-size="13">skip</text><text class="muted" x="105" y="151" text-anchor="middle" font-size="15">jump over frames</text></g>
    <g transform="translate(696 0)"><rect width="210" height="190" rx="14" class="purple" opacity=".18" stroke="#6a3d9a" stroke-width="3"/><text class="text" x="105" y="34" text-anchor="middle" font-size="19" font-weight="700">Transformer</text><text class="muted" x="105" y="62" text-anchor="middle" font-size="15">autoregressive</text><g fill="#6a3d9a"><rect x="28" y="91" width="32" height="32" rx="6"/><rect x="68" y="91" width="32" height="32" rx="6"/><rect x="108" y="91" width="32" height="32" rx="6"/><rect x="148" y="91" width="32" height="32" rx="6"/></g><path d="M44 137h136" stroke="#6a3d9a" stroke-width="3"/><text class="muted" x="105" y="158" text-anchor="middle" font-size="15">one token at a time</text></g>
  </g>
  <text class="muted" x="500" y="380" text-anchor="middle" font-size="17">Same encoder output, different alignment and decoding contracts.</text>
  <text class="muted" x="500" y="414" text-anchor="middle" font-size="16">TDT's duration prediction belongs to its head and runtime.</text>
</svg>
