<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Parakeet and Cohere Transcribe model map</title>
  <desc id="desc">Parakeet is shown as a family of FastConformer encoders with CTC, RNN-T, and TDT heads, while Cohere Transcribe has a FastConformer encoder and an autoregressive Transformer decoder.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{fill:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.red{fill:#b43d00}.purple{fill:#563080}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}}
  </style>
  <rect class="bg" width="1000" height="560" rx="24"/>
  <text class="text" x="48" y="54" font-size="32" font-weight="700">Same family resemblance, different exits</text>
  <text class="muted" x="48" y="88" font-size="20">A shared encoder idea does not mean shared checkpoints or capabilities.</text>
  <g transform="translate(48 115)">
    <rect width="420" height="345" rx="18" fill="#0072b2" opacity=".12" stroke="#005a8d" stroke-width="4"/><text class="text" x="210" y="40" text-anchor="middle" font-size="23" font-weight="700">Parakeet collection</text><text class="muted" x="210" y="68" text-anchor="middle" font-size="17">FastConformer encoder family</text><rect x="105" y="98" width="210" height="64" rx="12" class="blue"/><text fill="white" x="210" y="137" text-anchor="middle" font-size="20" font-weight="700">FastConformer</text><path d="M210 162v38M105 200h210" class="line" stroke-width="4"/><path d="M105 200v30M210 200v30M315 200v30" class="line" stroke-width="4"/><rect x="38" y="230" width="134" height="56" rx="10" class="orange"/><rect x="143" y="230" width="134" height="56" rx="10" class="green"/><rect x="248" y="230" width="134" height="56" rx="10" class="red"/><text fill="white" x="105" y="265" text-anchor="middle" font-size="18" font-weight="700">CTC</text><text fill="white" x="210" y="265" text-anchor="middle" font-size="18" font-weight="700">RNN-T</text><text fill="white" x="315" y="265" text-anchor="middle" font-size="18" font-weight="700">TDT</text>
    <g transform="translate(484 0)"><rect width="420" height="345" rx="18" fill="#6a3d9a" opacity=".12" stroke="#563080" stroke-width="4"/><text class="text" x="210" y="40" text-anchor="middle" font-size="23" font-weight="700">Cohere Transcribe</text><text class="muted" x="210" y="68" text-anchor="middle" font-size="17">separate multilingual model</text><rect x="105" y="98" width="210" height="64" rx="12" class="blue"/><text fill="white" x="210" y="128" text-anchor="middle" font-size="18" font-weight="700">FastConformer</text><text fill="white" x="210" y="150" text-anchor="middle" font-size="15">48-layer encoder</text><path d="M210 162v38" class="line" stroke-width="4"/><rect x="78" y="230" width="264" height="56" rx="10" class="purple"/><text fill="white" x="210" y="254" text-anchor="middle" font-size="17" font-weight="700">8-layer Transformer</text><text fill="white" x="210" y="276" text-anchor="middle" font-size="15">autoregressive decoder</text></g>
  </g>
  <text class="muted" x="500" y="510" text-anchor="middle" font-size="19">Encoder similarity does not imply shared limits or features.</text>
</svg>
