<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Parakeet and Cohere Transcribe model map</title>
  <desc id="desc">Parakeet is shown as a family of FastConformer encoders with CTC, RNN-T, and TDT heads, while Cohere Transcribe has a FastConformer encoder and an autoregressive Transformer decoder.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#475569;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{fill:#0072b2}.orange{fill:#e69f00}.green{fill:#009e73}.red{fill:#d55e00}.purple{fill:#6a3d9a}.sky{fill:#56b4e9}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#cbd5e1}.line{stroke:#cbd5e1}}
  </style>
  <rect class="bg" width="1000" height="520" rx="24"/>
  <text class="text" x="48" y="54" font-size="27" font-weight="700">Same family resemblance, different exits</text>
  <g transform="translate(48 100)">
    <rect width="420" height="330" rx="18" fill="#0072b2" opacity=".1" stroke="#0072b2" stroke-width="3"/><text class="text" x="210" y="38" text-anchor="middle" font-size="22" font-weight="700">Parakeet collection</text><text class="muted" x="210" y="64" text-anchor="middle" font-size="15">FastConformer encoder family</text><rect x="105" y="95" width="210" height="64" rx="12" class="blue"/><text fill="white" x="210" y="134" text-anchor="middle" font-size="19" font-family="system-ui,sans-serif">FastConformer</text><path d="M210 159v35M105 194h210" class="line" stroke-width="3"/><path d="M105 194v28M210 194v28M315 194v28" class="line" stroke-width="3"/><rect x="38" y="222" width="134" height="54" rx="10" class="orange"/><rect x="143" y="222" width="134" height="54" rx="10" class="green"/><rect x="248" y="222" width="134" height="54" rx="10" class="red"/><text class="text" x="105" y="255" text-anchor="middle" font-size="17">CTC</text><text fill="white" x="210" y="255" text-anchor="middle" font-size="17">RNN-T</text><text fill="white" x="315" y="255" text-anchor="middle" font-size="17">TDT</text>
    <g transform="translate(484 0)"><rect width="420" height="330" rx="18" fill="#6a3d9a" opacity=".1" stroke="#6a3d9a" stroke-width="3"/><text class="text" x="210" y="38" text-anchor="middle" font-size="22" font-weight="700">Cohere Transcribe</text><text class="muted" x="210" y="64" text-anchor="middle" font-size="15">separate multilingual model</text><rect x="105" y="95" width="210" height="64" rx="12" class="blue"/><text fill="white" x="210" y="124" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif">FastConformer</text><text fill="white" x="210" y="146" text-anchor="middle" font-size="14" font-family="system-ui,sans-serif">48-layer encoder</text><path d="M210 159v35" class="line" stroke-width="3"/><rect x="78" y="222" width="264" height="54" rx="10" class="purple"/><text fill="white" x="210" y="246" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif">8-layer Transformer</text><text fill="white" x="210" y="266" text-anchor="middle" font-size="13" font-family="system-ui,sans-serif">autoregressive decoder</text></g>
  </g>
  <text class="muted" x="500" y="475" text-anchor="middle" font-size="16">Encoder similarity does not imply shared checkpoints, limits, or features.</text>
</svg>
