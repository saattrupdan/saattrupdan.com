<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">From waveform to filterbank frames</title>
  <desc id="desc">A waveform is divided into overlapping windows and transformed into an 80-channel time by frequency grid.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{stroke:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.sky{fill:#277fa8}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}}
  </style>
  <rect class="bg" width="1000" height="560" rx="24"/>
  <text class="text" x="48" y="58" font-size="32" font-weight="700">One utterance, three views</text>
  <text class="muted" x="48" y="92" font-size="21">“The small green boat is leaving.”</text>
  <text class="text" x="54" y="145" font-size="22" font-weight="700">pressure wave</text>
  <line class="line" x1="54" y1="238" x2="430" y2="238" stroke-width="3"/>
  <path class="blue" d="M54 238 C70 238 74 205 88 238 S108 270 124 238 S145 214 161 238 S181 260 196 238 S213 184 232 238 S252 280 269 238 S289 215 306 238 S325 262 341 238 S358 196 375 238 S400 252 430 238" fill="none" stroke-width="5" stroke-linecap="round"/>
  <g class="orange" opacity=".24"><rect x="110" y="120" width="112" height="238" rx="8"/><rect x="202" y="120" width="112" height="238" rx="8"/><rect x="294" y="120" width="112" height="238" rx="8"/></g>
  <g class="orange" opacity=".95"><text class="text" x="128" y="385" font-size="18" font-weight="700">25 ms</text><text class="text" x="224" y="410" font-size="18" font-weight="700">shift 10 ms</text></g>
  <path d="M460 238H520" class="line" stroke-width="4"/><path d="m510 227 13 11-13 11" fill="none" class="line" stroke-width="4"/>
  <text class="text" x="542" y="145" font-size="22" font-weight="700">80-channel filterbank</text>
  <text class="muted" x="542" y="177" font-size="18">time →</text>
  <text class="muted" transform="translate(548 334) rotate(-90)" font-size="18">frequency →</text>
  <g stroke="#f8fafc" stroke-width="2">
    <rect x="574" y="194" width="40" height="174" class="sky"/><rect x="616" y="194" width="40" height="174" class="green"/><rect x="658" y="194" width="40" height="174" class="orange"/><rect x="700" y="194" width="40" height="174" fill="#b43d00"/><rect x="742" y="194" width="40" height="174" class="sky"/><rect x="784" y="194" width="40" height="174" class="green"/><rect x="826" y="194" width="40" height="174" class="orange"/><rect x="868" y="194" width="40" height="174" fill="#b43d00"/>
  </g>
  <g opacity=".35" fill="#fff"><path d="M574 250h334v22H574z"/><path d="M574 312h334v18H574z"/></g>
  <text class="muted" x="574" y="405" font-size="19">overlapping frames</text>
  <text class="muted" x="574" y="434" font-size="19">energy across frequencies</text>
</svg>
