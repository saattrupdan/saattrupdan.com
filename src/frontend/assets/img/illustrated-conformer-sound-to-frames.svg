<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">From waveform to filterbank frames</title>
  <desc id="desc">A waveform is divided into overlapping windows and transformed into an 80-channel time by frequency grid.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{stroke:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.sky{fill:#277fa8}.window{fill:#a85d00;fill-opacity:.04;stroke:#a85d00;stroke-opacity:.58;stroke-width:1.5}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}.window{fill:#e69f00;stroke:#e69f00}}
  </style>
  <text class="text" x="48" y="58" font-size="32" font-weight="700">One utterance, three views</text>
  <text class="muted" x="48" y="92" font-size="21">“The small green boat is leaving.”</text>
  <text class="text" x="54" y="145" font-size="22" font-weight="700">pressure wave</text>
  <line class="line" x1="54" y1="238" x2="430" y2="238" stroke-width="3"/>
  <path class="blue" d="M54 238 C70 238 74 205 88 238 S108 270 124 238 S145 214 161 238 S181 260 196 238 S213 184 232 238 S252 280 269 238 S289 215 306 238 S325 262 341 238 S358 196 375 238 S400 252 430 238" fill="none" stroke-width="5" stroke-linecap="round"/>
  <g><rect class="window" x="54" y="170" width="112" height="136" rx="7"/><rect class="window" x="99" y="170" width="112" height="136" rx="7"/><rect class="window" x="144" y="170" width="112" height="136" rx="7"/><rect class="window" x="189" y="170" width="112" height="136" rx="7"/><rect class="window" x="234" y="170" width="112" height="136" rx="7"/><rect class="window" x="279" y="170" width="112" height="136" rx="7"/><rect class="window" x="324" y="170" width="112" height="136" rx="7"/></g>
  <g class="line" fill="none" stroke-width="2"><path d="M54 320v12m0-6h112m0-6v12"/><path d="M54 354v12m0-6h45m0-6v12"/></g>
  <text class="text" x="178" y="332" font-size="17" font-weight="700">25 ms window</text>
  <text class="text" x="111" y="366" font-size="17" font-weight="700">10 ms shift</text>
  <path d="M460 238H520" class="line" stroke-width="4"/><path d="m510 227 13 11-13 11" fill="none" class="line" stroke-width="4"/>
  <g transform="translate(30 0)">
    <text class="text" x="542" y="145" font-size="22" font-weight="700">80-channel filterbank</text>
    <text class="muted" x="542" y="177" font-size="18">time frames →</text>
    <text class="muted" transform="translate(548 368) rotate(-90)" font-size="18">frequency channels →</text>
    <g stroke="#f8fafc" stroke-width="2">
      <rect x="574" y="194" width="40" height="174" class="sky"/><rect x="616" y="194" width="40" height="174" class="green"/><rect x="658" y="194" width="40" height="174" class="orange"/><rect x="700" y="194" width="40" height="174" fill="#b43d00"/><rect x="742" y="194" width="40" height="174" class="sky"/><rect x="784" y="194" width="40" height="174" class="green"/><rect x="826" y="194" width="40" height="174" class="orange"/><rect x="868" y="194" width="40" height="174" fill="#b43d00"/>
    </g>
    <g opacity=".35" fill="#fff"><path d="M574 250h334v22H574z"/><path d="M574 312h334v18H574z"/></g>
    <g transform="translate(574 402)">
      <rect width="24" height="24" rx="4" class="sky"/>
      <rect x="28" width="24" height="24" rx="4" class="green"/>
      <rect x="56" width="24" height="24" rx="4" class="orange"/>
      <rect x="84" width="24" height="24" rx="4" fill="#b43d00"/>
      <text class="muted" x="120" y="19" font-size="17">colour encodes log-Mel energy</text>
    </g>
  </g>
</svg>
