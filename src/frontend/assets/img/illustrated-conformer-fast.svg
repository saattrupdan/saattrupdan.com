<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">FastConformer front end and attention</title>
  <desc id="desc">Three two-times subsampling stages, with depthwise-separable convolution in the second and third stages, make the sequence one eighth as long. Each Conformer block keeps the same topology while its depthwise convolution kernel changes from the paper's baseline 31 to 9.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{fill:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.red{fill:#b43d00}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}}
  </style>
  <text class="text" x="48" y="54" font-size="32" font-weight="700">FastConformer changes the front door</text>
  <text class="muted" x="48" y="88" font-size="20">Three 2x stages make one eighth as many time positions.</text>
  <g transform="translate(48 145)">
    <rect width="145" height="205" rx="14" fill="#56b4e9" opacity=".3" stroke="#005a8d" stroke-width="4"/>
    <g fill="#005a8d"><rect x="24" y="28" width="97" height="24" rx="5"/><rect x="24" y="70" width="97" height="24" rx="5"/><rect x="24" y="112" width="97" height="24" rx="5"/><rect x="24" y="154" width="97" height="14" rx="4"/></g>
    <text class="text" x="72" y="248" text-anchor="middle" font-size="20" font-weight="700">feature frames</text>
  </g>
  <path d="M205 248h27" class="line" stroke-width="4"/><path d="m223 237 14 11-14 11" fill="none" class="line" stroke-width="4"/>
  <g transform="translate(250 145)">
    <rect width="175" height="205" rx="14" fill="#e69f00" opacity=".25" stroke="#a85d00" stroke-width="4"/>
    <g fill="#a85d00"><rect x="15" y="26" width="145" height="30" rx="6"/><rect x="15" y="82" width="145" height="30" rx="6"/><rect x="15" y="138" width="145" height="30" rx="6"/></g>
    <text fill="white" x="87" y="47" text-anchor="middle" font-size="16" font-weight="700">2x / regular</text>
    <text fill="white" x="87" y="103" text-anchor="middle" font-size="16" font-weight="700">2x / depthwise</text>
    <text fill="white" x="87" y="159" text-anchor="middle" font-size="16" font-weight="700">2x / depthwise</text>
    <text class="text" x="87" y="248" text-anchor="middle" font-size="19" font-weight="700">subsampling</text>
  </g>
  <path d="M437 248h27" class="line" stroke-width="4"/><path d="m455 237 14 11-14 11" fill="none" class="line" stroke-width="4"/>
  <g transform="translate(482 145)">
    <rect width="155" height="205" rx="14" fill="#009e73" opacity=".25" stroke="#007a59" stroke-width="4"/>
    <rect x="27" y="35" width="101" height="22" rx="5" fill="#007a59"/><rect x="40" y="91" width="75" height="22" rx="5" fill="#007a59"/><rect x="53" y="147" width="49" height="22" rx="5" fill="#007a59"/>
    <text class="text" x="77" y="248" text-anchor="middle" font-size="20" font-weight="700">8x shorter</text>
  </g>
  <path d="M649 248h27" class="line" stroke-width="4"/><path d="m667 237 14 11-14 11" fill="none" class="line" stroke-width="4"/>
  <g transform="translate(694 145)">
    <rect width="258" height="205" rx="14" fill="#d55e00" opacity=".22" stroke="#b43d00" stroke-width="4"/>
    <text class="text" x="129" y="42" text-anchor="middle" font-size="21" font-weight="700">Conformer block</text>
    <text class="muted" x="129" y="72" text-anchor="middle" font-size="17">same topology</text>
    <rect x="30" y="94" width="198" height="82" rx="12" class="red"/>
    <text fill="white" x="129" y="125" text-anchor="middle" font-size="17" font-weight="700">convolution module</text>
    <text fill="white" x="129" y="157" text-anchor="middle" font-size="20" font-weight="700">kernel size: 31 → 9</text>
  </g>
</svg>
