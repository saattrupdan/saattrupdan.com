<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
  <title id="title">Conformer block with top-to-bottom flow and residual additions</title>
  <desc id="desc">An input representation passes through an FFN whose output is multiplied by one half before residual addition, relative multi-head self-attention, convolution, a second FFN with the same scaling, and final LayerNorm. Each unscaled input also follows a residual path around its module and rejoins at a plus node.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.arrow{fill:#334155}.node{fill:#ffffff;stroke:#1f2937}.node-text{fill:#1f2937}.blue{fill:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.purple{fill:#563080}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}.arrow{fill:#cbd5e1}.node{fill:#1f2937;stroke:#f8fafc}.node-text{fill:#ffffff}}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 10 5 0 10Z"/></marker>
  </defs>
  <text class="text" x="48" y="53" font-size="32" font-weight="700">One Conformer block</text>
  <text class="muted" x="48" y="86" font-size="20">Every module updates the running representation.</text>
  <text class="muted" x="500" y="118" text-anchor="middle" font-size="18" font-weight="700">INPUT · representation</text>

  <path d="M500 126V150" class="line" fill="none" stroke-width="4"/>
  <path d="M500 136H220V290H484" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 150)"><rect width="400" height="58" rx="14" class="blue"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">FFN</text></g>
  <path d="M500 208V220" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(455 220)"><rect width="90" height="38" rx="10" class="node" stroke-width="4"/><text class="node-text" x="45" y="27" text-anchor="middle" font-size="21" font-weight="700">× 1/2</text></g>
  <path d="M500 258V274" class="line" fill="none" stroke-width="4"/>
  <circle class="node" cx="500" cy="290" r="16" stroke-width="4"/><text class="node-text" x="500" y="297" text-anchor="middle" font-size="24" font-weight="700">+</text>

  <path d="M500 306V336" class="line" fill="none" stroke-width="4"/>
  <path d="M500 322H220V426H484" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 336)"><rect width="400" height="58" rx="14" class="orange"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="21" font-family="system-ui,sans-serif" font-weight="700">relative MHSA</text></g>
  <path d="M500 394V410" class="line" fill="none" stroke-width="4"/>
  <circle class="node" cx="500" cy="426" r="16" stroke-width="4"/><text class="node-text" x="500" y="433" text-anchor="middle" font-size="24" font-weight="700">+</text>

  <path d="M500 442V472" class="line" fill="none" stroke-width="4"/>
  <path d="M500 458H220V562H484" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 472)"><rect width="400" height="58" rx="14" class="green"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">convolution</text></g>
  <path d="M500 530V546" class="line" fill="none" stroke-width="4"/>
  <circle class="node" cx="500" cy="562" r="16" stroke-width="4"/><text class="node-text" x="500" y="569" text-anchor="middle" font-size="24" font-weight="700">+</text>

  <path d="M500 578V608" class="line" fill="none" stroke-width="4"/>
  <path d="M500 594H220V748H484" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 608)"><rect width="400" height="58" rx="14" class="blue"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">FFN</text></g>
  <path d="M500 666V678" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(455 678)"><rect width="90" height="38" rx="10" class="node" stroke-width="4"/><text class="node-text" x="45" y="27" text-anchor="middle" font-size="21" font-weight="700">× 1/2</text></g>
  <path d="M500 716V732" class="line" fill="none" stroke-width="4"/>
  <circle class="node" cx="500" cy="748" r="16" stroke-width="4"/><text class="node-text" x="500" y="755" text-anchor="middle" font-size="24" font-weight="700">+</text>

  <path d="M500 764V794" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(350 794)"><rect width="300" height="58" rx="14" class="purple"/><text x="150" y="37" text-anchor="middle" fill="white" font-size="21" font-family="system-ui,sans-serif" font-weight="700">final LayerNorm</text></g>
  <path d="M500 852V890" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="muted" x="500" y="922" text-anchor="middle" font-size="18" font-weight="700">OUTPUT · representation</text>
  <text class="muted" x="155" y="190" text-anchor="middle" font-size="17">residual paths</text>
</svg>
