<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Exact Conformer block with residual additions</title>
  <desc id="desc">A connected Conformer block applies a half FFN, relative multi-head self-attention, convolution, and a second half FFN. Each module has its own residual addition before final LayerNorm.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{fill:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.purple{fill:#563080}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}}
  </style>
  <rect class="bg" width="1000" height="760" rx="24"/>
  <text class="text" x="48" y="53" font-size="32" font-weight="700">One Conformer block</text>
  <text class="muted" x="48" y="86" font-size="20">Every module adds its update to the running representation.</text>
  <text class="muted" x="500" y="117" text-anchor="middle" font-size="18" font-weight="700">input representation</text>

  <path d="M500 126v18" class="line" stroke-width="4"/>
  <path d="M500 144H205v61h275" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 144)"><rect width="400" height="58" rx="14" class="blue"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">1/2 FFN</text></g>
  <path d="M500 202v3" class="line" stroke-width="4"/>
  <circle cx="500" cy="220" r="16" fill="#f8fafc" stroke="#334155" stroke-width="4"/><text class="text" x="500" y="227" text-anchor="middle" font-size="24" font-weight="700">+</text>
  <path d="M500 236v29" class="line" stroke-width="4"/>

  <path d="M500 265H205v61h275" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 265)"><rect width="400" height="58" rx="14" class="orange"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="21" font-family="system-ui,sans-serif" font-weight="700">relative MHSA</text></g>
  <path d="M500 323v3" class="line" stroke-width="4"/>
  <circle cx="500" cy="341" r="16" fill="#f8fafc" stroke="#334155" stroke-width="4"/><text class="text" x="500" y="348" text-anchor="middle" font-size="24" font-weight="700">+</text>
  <path d="M500 357v29" class="line" stroke-width="4"/>

  <path d="M500 386H205v61h275" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 386)"><rect width="400" height="58" rx="14" class="green"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">convolution</text></g>
  <path d="M500 444v3" class="line" stroke-width="4"/>
  <circle cx="500" cy="462" r="16" fill="#f8fafc" stroke="#334155" stroke-width="4"/><text class="text" x="500" y="469" text-anchor="middle" font-size="24" font-weight="700">+</text>
  <path d="M500 478v29" class="line" stroke-width="4"/>

  <path d="M500 507H205v61h275" class="line" fill="none" stroke-width="4"/>
  <g transform="translate(300 507)"><rect width="400" height="58" rx="14" class="blue"/><text x="200" y="37" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">1/2 FFN</text></g>
  <path d="M500 565v3" class="line" stroke-width="4"/>
  <circle cx="500" cy="583" r="16" fill="#f8fafc" stroke="#334155" stroke-width="4"/><text class="text" x="500" y="590" text-anchor="middle" font-size="24" font-weight="700">+</text>
  <path d="M500 599v25" class="line" stroke-width="4"/><path d="m491 615 9 13 9-13" fill="none" class="line" stroke-width="4"/>
  <g transform="translate(350 630)"><rect width="300" height="58" rx="14" class="purple"/><text x="150" y="37" text-anchor="middle" fill="white" font-size="21" font-family="system-ui,sans-serif" font-weight="700">final LayerNorm</text></g>
  <path d="M500 688v24" class="line" stroke-width="4"/><text class="muted" x="500" y="738" text-anchor="middle" font-size="18" font-weight="700">output representation</text>
  <text class="muted" x="155" y="182" text-anchor="middle" font-size="17">residual path</text>
</svg>
