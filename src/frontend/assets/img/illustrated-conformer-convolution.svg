<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Conformer convolution module</title>
  <desc id="desc">The convolution module orders LayerNorm, pointwise convolution, GLU, depthwise convolution, BatchNorm, Swish, pointwise convolution, dropout, and residual addition.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#475569;font-family:system-ui,sans-serif}.line{stroke:#334155}.blue{fill:#0072b2}.orange{fill:#e69f00}.green{fill:#009e73}.red{fill:#d55e00}.purple{fill:#6a3d9a}.sky{fill:#56b4e9}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#cbd5e1}.line{stroke:#cbd5e1}}
  </style>
  <rect class="bg" width="1000" height="430" rx="24"/>
  <text class="text" x="48" y="55" font-size="27" font-weight="700">The local convolution module</text>
  <text class="muted" x="48" y="84" font-size="16">Read left to right, then add the result back to the block input.</text>
  <g transform="translate(44 140)">
    <g transform="translate(0 0)"><rect width="112" height="78" rx="12" class="purple"/><text x="56" y="34" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif">LayerNorm</text><text x="56" y="57" text-anchor="middle" fill="white" font-size="14" font-family="system-ui,sans-serif">normalise</text></g>
    <path d="M120 39h17" class="line" stroke-width="3"/><path d="m132 31 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(146 0)"><rect width="112" height="78" rx="12" class="blue"/><text x="56" y="31" text-anchor="middle" fill="white" font-size="16" font-family="system-ui,sans-serif">pointwise</text><text x="56" y="55" text-anchor="middle" fill="white" font-size="16" font-family="system-ui,sans-serif">conv</text></g>
    <path d="M266 39h17" class="line" stroke-width="3"/><path d="m278 31 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(292 0)"><rect width="112" height="78" rx="12" class="orange"/><text x="56" y="46" text-anchor="middle" fill="#1f2937" font-size="19" font-family="system-ui,sans-serif" font-weight="650">GLU</text></g>
    <path d="M412 39h17" class="line" stroke-width="3"/><path d="m424 31 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(438 0)"><rect width="112" height="78" rx="12" class="green"/><text x="56" y="29" text-anchor="middle" fill="white" font-size="15" font-family="system-ui,sans-serif">depthwise</text><text x="56" y="53" text-anchor="middle" fill="white" font-size="15" font-family="system-ui,sans-serif">1-D conv</text></g>
    <path d="M558 39h17" class="line" stroke-width="3"/><path d="m570 31 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(584 0)"><rect width="112" height="78" rx="12" class="sky"/><text x="56" y="46" text-anchor="middle" fill="#1f2937" font-size="18" font-family="system-ui,sans-serif">BatchNorm</text></g>
  </g>
  <g transform="translate(190 278)">
    <g><rect width="140" height="72" rx="12" class="red"/><text x="70" y="44" text-anchor="middle" fill="white" font-size="19" font-family="system-ui,sans-serif">Swish</text></g>
    <path d="M148 36h22" class="line" stroke-width="3"/><path d="m162 28 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(180 0)"><rect width="140" height="72" rx="12" class="blue"/><text x="70" y="29" text-anchor="middle" fill="white" font-size="16" font-family="system-ui,sans-serif">pointwise</text><text x="70" y="52" text-anchor="middle" fill="white" font-size="16" font-family="system-ui,sans-serif">conv</text></g>
    <path d="M328 36h22" class="line" stroke-width="3"/><path d="m342 28 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(360 0)"><rect width="140" height="72" rx="12" class="orange"/><text x="70" y="44" text-anchor="middle" fill="#1f2937" font-size="18" font-family="system-ui,sans-serif">dropout</text></g>
    <path d="M508 36h22" class="line" stroke-width="3"/><path d="m522 28 9 8-9 8" fill="none" class="line" stroke-width="3"/>
    <g transform="translate(540 0)"><rect width="140" height="72" rx="12" class="purple"/><text x="70" y="30" text-anchor="middle" fill="white" font-size="16" font-family="system-ui,sans-serif">residual</text><text x="70" y="52" text-anchor="middle" fill="white" font-size="16" font-family="system-ui,sans-serif">addition</text></g>
  </g>
  <text class="muted" x="500" y="390" text-anchor="middle" font-size="16">The depthwise convolution supplies the local temporal bias.</text>
</svg>
