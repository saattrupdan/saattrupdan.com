<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Conformer convolution module</title>
  <desc id="desc">The convolution module maps d to 2d with a pointwise convolution, uses GLU to return d, applies depthwise convolution at d channels, and projects d to d before residual addition.</desc>
  <style>
    .bg{fill:#f8fafc}.text{fill:#1f2937;font-family:system-ui,sans-serif}.muted{fill:#334155;font-family:system-ui,sans-serif}.line{stroke:#334155}.arrowhead{fill:#334155}.blue{fill:#005a8d}.orange{fill:#a85d00}.green{fill:#007a59}.red{fill:#b43d00}.purple{fill:#563080}.sky{fill:#236b8b}
    @media(prefers-color-scheme:dark){.bg{fill:#111827}.text{fill:#f8fafc}.muted{fill:#e2e8f0}.line{stroke:#cbd5e1}.arrowhead{fill:#cbd5e1}}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrowhead" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>
  <text class="text" x="48" y="55" font-size="32" font-weight="700">The local convolution module</text>
  <text class="muted" x="48" y="88" font-size="20">Channels expand, gate, filter locally, then return to the block width.</text>
  <g transform="translate(20 145)">
    <g><rect width="140" height="94" rx="12" class="purple"/><text x="70" y="40" text-anchor="middle" fill="white" font-size="19" font-family="system-ui,sans-serif" font-weight="700">LayerNorm</text><text x="70" y="68" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif">normalise</text></g>
    <path d="M140 47h35" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(175 0)"><rect width="140" height="94" rx="12" class="blue"/><text x="70" y="38" text-anchor="middle" fill="white" font-size="18" font-family="system-ui,sans-serif" font-weight="700">pointwise</text><text x="70" y="66" text-anchor="middle" fill="white" font-size="18" font-family="system-ui,sans-serif" font-weight="700">d → 2d</text></g>
    <path d="M315 47h35" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(350 0)"><rect width="140" height="94" rx="12" class="orange"/><text x="70" y="42" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">GLU</text><text x="70" y="70" text-anchor="middle" fill="white" font-size="18" font-family="system-ui,sans-serif">2d → d</text></g>
    <path d="M490 47h35" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(525 0)"><rect width="140" height="94" rx="12" class="green"/><text x="70" y="36" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif" font-weight="700">depthwise</text><text x="70" y="65" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif">d channels</text></g>
    <path d="M665 47h35" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(700 0)"><rect width="140" height="94" rx="12" class="sky"/><text x="70" y="52" text-anchor="middle" fill="white" font-size="19" font-family="system-ui,sans-serif" font-weight="700">BatchNorm</text></g>
  </g>
  <path d="M860 192h70v78H200v30" class="line" fill="none" stroke-width="4" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g transform="translate(125 300)">
    <g><rect width="150" height="82" rx="12" class="red"/><text x="75" y="50" text-anchor="middle" fill="white" font-size="22" font-family="system-ui,sans-serif" font-weight="700">Swish</text></g>
    <path d="M150 41h40" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(190 0)"><rect width="150" height="82" rx="12" class="blue"/><text x="75" y="33" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif" font-weight="700">pointwise</text><text x="75" y="61" text-anchor="middle" fill="white" font-size="18" font-family="system-ui,sans-serif" font-weight="700">d → d</text></g>
    <path d="M340 41h40" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(380 0)"><rect width="150" height="82" rx="12" class="orange"/><text x="75" y="50" text-anchor="middle" fill="white" font-size="20" font-family="system-ui,sans-serif" font-weight="700">dropout</text></g>
    <path d="M530 41h40" class="line" fill="none" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(570 0)"><rect width="170" height="82" rx="12" class="purple"/><text x="85" y="34" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif" font-weight="700">residual</text><text x="85" y="61" text-anchor="middle" fill="white" font-size="17" font-family="system-ui,sans-serif" font-weight="700">addition</text></g>
  </g>
  <text class="muted" x="500" y="440" text-anchor="middle" font-size="19">The depthwise convolution supplies the local temporal bias at width d.</text>
</svg>
